<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" fill="none">
  <defs>
    <linearGradient id="logo-em-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="logo-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Icon (rounded squircle) -->
  <g transform="translate(10, 16)">
    <rect width="128" height="128" rx="36" fill="url(#logo-em-grad)"/>
    <circle cx="64" cy="64" r="50" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" />
    
    <!-- Pediment Roof -->
    <path d="M64 30 L98 48 L30 48 Z" fill="url(#logo-gold-grad)"/>
    <rect x="30" y="50" width="68" height="6" rx="2" fill="#ffffff"/>
    
    <!-- 4 Pillars -->
    <rect x="35" y="59" width="9" height="34" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="52" y="59" width="9" height="34" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="67" y="59" width="9" height="34" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="84" y="59" width="9" height="34" rx="2" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Base Steps -->
    <rect x="28" y="96" width="72" height="6" rx="2" fill="#ffffff"/>
    <rect x="24" y="104" width="80" height="6" rx="2" fill="url(#logo-gold-grad)"/>
  </g>

  <!-- Brand Typography -->
  <text x="156" y="78" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2" fill="#0f172a">
    World Bank <tspan fill="#059669">Codes</tspan>
  </text>
  
  <text x="158" y="112" font-family="Plus Jakarta Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1.8" fill="#64748b">
    GLOBAL BANK ROUTING &amp; SWIFT DIRECTORY
  </text>
</svg>
