<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="wbc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#wbc-grad)"/>
  
  <!-- Outer Globe Ring subtle stroke -->
  <circle cx="256" cy="256" r="200" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12" />
  
  <!-- Stylized Financial Columns & Pediment -->
  <!-- Roof / Pediment Triangle -->
  <path d="M256 120 L380 188 L132 188 Z" fill="url(#gold-grad)"/>
  
  <!-- Architrave horizontal bar -->
  <rect x="132" y="196" width="248" height="20" rx="6" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- 4 Classical Pillars (Bank Security) -->
  <rect x="152" y="226" width="34" height="120" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="214" y="226" width="34" height="120" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="264" y="226" width="34" height="120" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  <rect x="326" y="226" width="34" height="120" rx="8" fill="#ffffff" fill-opacity="0.92"/>
  
  <!-- Base Foundation Steps -->
  <rect x="124" y="354" width="264" height="22" rx="6" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="108" y="382" width="296" height="22" rx="7" fill="url(#gold-grad)"/>
</svg>
